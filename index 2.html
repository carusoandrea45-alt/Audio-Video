<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<title>Audio/Video – Turni</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f27;--mut:#6b7280;--ac:#2563eb;--bd:#e3e6eb;--hl:#fef3c7;--ed:#f59e0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--card:#1b2029;--tx:#e8ebf0;--mut:#9aa3b2;--ac:#6ea0ff;--bd:#2c3340;--hl:#4a3d12}}
:root[data-theme="dark"]{--bg:#12151b;--card:#1b2029;--tx:#e8ebf0;--mut:#9aa3b2;--ac:#6ea0ff;--bd:#2c3340;--hl:#4a3d12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
#lg{width:52px;height:52px;border-radius:50%;object-fit:cover}
h1{font-size:22px;margin:0}.sub{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button,select{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.on,button.pr{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.4}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:12px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
th{color:var(--mut);font-weight:600}
td.c{cursor:pointer;text-decoration:underline dotted var(--mut);text-underline-offset:3px}td.hl{background:var(--hl);font-weight:600}
td.e{box-shadow:inset 3px 0 var(--ed)}
td.n,th.n{text-align:center}
.ok{color:#16a34a;font-size:13px}.wr{color:#d97706;font-size:13px}
#md{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#md>div{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.lg{font-size:13px;color:var(--mut);padding:4px 0;border-bottom:1px solid var(--bd)}
.ph{display:none}
#pa{display:none}
@media print{body.pa .card,body.pa .hd{display:none}body.pa #pa{display:block;color:#000;font-size:11px}#pa table{white-space:normal;font-size:10px}td.c{text-decoration:none}.wr{display:none}body{background:#fff;color:#000;padding:0}.bar,#chk,#stc,#lgc,#md,.hd .sub{display:none}.card{border:0;padding:0}.ph{display:block;font-size:16px;font-weight:700;margin-bottom:6px}th,td{color:#000;font-size:10px;padding:3px 5px}td.hl{background:none;font-weight:400}td.e{box-shadow:none;font-weight:700}}
.dl{display:none}
@page{size:A4 landscape;margin:10mm}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ph{font-size:30px;font-weight:800;color:#1e3a8a;margin-bottom:14px}
.ds{display:none}.dl{display:inline;text-transform:capitalize}
#tb{font-size:16px;border-collapse:collapse;width:100%;white-space:normal}
#tb th{background:#1e3a8a;color:#fff;font-size:16px;padding:12px 8px;text-align:center}
#tb td{padding:13px 8px;border:1px solid #cbd5e1;font-size:16px;text-align:center}
#tb td:first-child{text-align:left;font-weight:700;color:#1e3a8a;background:#eff6ff}
#tb tr:nth-child(even) td:not(:first-child){background:#f1f5f9}
#tb tr{page-break-inside:avoid}}
body{padding-bottom:84px}
#rb{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--ac);color:#fff;border-color:var(--ac);padding:12px 24px;border-radius:26px;box-shadow:0 4px 14px #0004;font-weight:600}
#rs{position:fixed;inset:0;z-index:8;background:#0006;visibility:hidden;opacity:0;transition:opacity .25s,visibility .25s}
#rs.o{visibility:visible;opacity:1}
#rsb{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s}
#rs.o #rsb{transform:none}
@media print{#rb,#rs{display:none!important}}
</style></head><body>

const ok=w=>{const n=w.filter(p=>!MO.includes(p));return n.length>=4&&n.some(p=>!Y.includes(p))};
function gen(){const out={};let prev=[];
[[2026,[1,6]],[2027,[2,0]]].forEach(([y,d])=>{const tot=Array(12).fill(0),cnt=P.map(()=>R.map(()=>0));
out[y]=dates(y,d).map(dt=>{
const sc=P.map((_,p)=>({p,s:tot[p]*10+(prev.includes(p)?3:0)+rnd()*6})).sort((a,b)=>a.s-b.s).map(x=>x.p);
let w=sc.slice(0,6);
if(!ok(w))o:for(let i=5;i>=0;i--)for(let j=6;j<12;j++){const t=w.slice();t[i]=sc[j];if(ok(t)){w=t;break o}}
let best=null,bc=1e9;perms(w,cnt,a=>{let c=rnd()*.5;a.forEach((p,r)=>c+=cnt[p][r]*cnt[p][r]*2+cnt[p][r]);if(c<bc){bc=c;best=a}});
best.forEach((p,r)=>{cnt[p][r]++;tot[p]++});prev=w;return{d:dt,a:best,e:[]}})});return out}
let S;try{S=JSON.parse(localStorage.getItem("av4"))}catch(e){}
if(!S||!S.D)S={D:gen(),log:[]};
const save=()=>{try{localStorage.setItem("av4",JSON.stringify(S))}catch(e){}};
let year=2026,M=Math.min(23,Math.max(10,(new Date().getFullYear()-2026)*12+new Date().getMonth())),sel=-1,ed=null;
const RL=["🎤 MIC 1","🎤 MIC 2","🎧 AUDIO","🎥 VIDEO","📖 PODIO","💻 ZOOM"],RS=["🎤1","🎤2","🎧","🎥","📖","💻"];
const fmtL=d=>new Date(d+"T00:00:00Z").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"});
const MN=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
$("sel").innerHTML='<option value="-1">Tutte le persone</option>'+P.map((p,i)=>`<option value="${i}">${p}</option>`).join("");
const fmt=s=>new Date(s+"T00:00:00Z").toLocaleDateString("it-IT",{weekday:"short",day:"2-digit",month:"short",timeZone:"UTC"});
function render(){year=2026+Math.floor(M/12);const mm=String(M%12+1).padStart(2,"0"),L=S.D[year],idx=[];
L.forEach((s,i)=>{if(s.d.slice(5,7)===mm)idx.push(i)});
$("mt").textContent=MN[M%12]+" "+year;$("rt").textContent=MN[M%12]+" "+year;$("pv").disabled=M<=10;$("nx").disabled=M>=23;
$("ph").textContent="🎧 Audio/Video · Turni "+MN[M%12]+" "+year+(sel>=0?" · "+P[sel]:"");
$("tb").innerHTML="<tr><th>Data</th>"+RL.map(r=>`<th>${r}</th>`).join("")+"</tr>"+
idx.map(i=>{const s=L[i];return sel>=0&&!s.a.includes(sel)?"":'<tr><td><b><span class="ds">'+fmt(s.d)+'</span><span class="dl">'+fmtL(s.d)+'</span></b></td>'+s.a.map((p,r)=>`<td class="c ${p===sel?"hl":""} ${s.e.includes(r)?"e":""}" data-i="${i}" data-r="${r}">${P[p]}</td>`).join("")+"</tr>"}).join("");
const c=P.map(()=>R.map(()=>0)),ya=P.map(()=>0);
L.forEach(s=>s.a.forEach(p=>ya[p]++));idx.forEach(i=>L[i].a.forEach((p,r)=>c[p][r]++));
$("st").innerHTML="<tr><th>Persona</th>"+RS.map(r=>`<th class="n">${r}</th>`).join("")+'<th class="n">Mese</th><th class="n">Anno</th></tr>'+
P.map((p,i)=>`<tr><td>${p}</td>`+c[i].map(v=>`<td class="n">${v}</td>`).join("")+`<td class="n"><b>${c[i].reduce((a,b)=>a+b)}</b></td><td class="n">${ya[i]}</td></tr>`).join("");
let cons=0;idx.forEach(i=>{if(i>0)L[i].a.forEach(p=>{if(L[i-1].a.includes(p))cons++})});
const bad=idx.filter(i=>Y.includes(L[i].a[2])&&Y.includes(L[i].a[3])).length;
$("chk").innerHTML=`<b>${idx.length} turni · ${MN[M%12]} ${year}</b><br><span class="ok">Totale anno: ${Math.min(...ya)}–${Math.max(...ya)} turni a testa · ${cons} presenze in giorni consecutivi nel mese</span>`+(bad?`<br><span class="wr">⚠ ${bad} turni con conflitto Audio/Video</span>`:`<br><span class="ok">✓ Nessun conflitto Audio/Video</span>`);
$("log").innerHTML=S.log.length?S.log.slice(0,30).map(x=>`<div class="lg">${x}</div>`).join(""):'<div class="lg">Nessuna modifica</div>'}
function check(i,r,p){const s=S.D[year][i];const m=[];let blk=false;
if(s.a.some((q,k)=>q===p&&k!==r)){m.push("Già in turno con un altro ruolo.");blk=true}
if(MO.includes(p)&&r>1){m.push("Può fare solo il microfonista.");blk=true}
const a=s.a.slice();a[r]=p;if(Y.includes(a[2])&&Y.includes(a[3]))m.push("⚠ Audio e Video entrambi tra i quattro ragazzi.");
return{m,blk}}
function open_(i,r){ed={i,r};const s=S.D[year][i];
$("mb").innerHTML=`<b>${fmt(s.d)} · ${R[r]}</b><select id="ps">${P.map((p,k)=>`<option value="${k}" ${k===s.a[r]?"selected":""}>${p}</option>`).join("")}</select><div id="wm" class="wr"></div>
<button class="pr" id="sv">Salva modifica</button><button id="ab">Assente → sostituisci in automatico</button><button id="cl">Annulla</button>`;
$("md").style.display="flex";const upd=()=>{const c=check(i,r,+$("ps").value);$("wm").innerHTML=c.m.join("<br>");$("sv").disabled=c.blk};
$("ps").onchange=upd;upd();$("cl").onclick=close_;
$("sv").onclick=()=>{const p=+$("ps").value;if(p!==s.a[r]){S.log.unshift(`${fmt(s.d)} ${year} · ${R[r]}: ${P[s.a[r]]} → ${P[p]} (manuale)`);s.a[r]=p;if(!s.e.includes(r))s.e.push(r)}save();close_();render()};
$("ab").onclick=()=>{const old=s.a[r],L=S.D[year];let best=-1,bs=1e9;
P.forEach((p,k)=>{if(k===old||s.a.includes(k)||!check(i,r,k).m.every(x=>!x.startsWith("⚠"))||check(i,r,k).blk)return;
const tot=L.filter(x=>x.a.includes(k)).length,adj=(L[i-1]&&L[i-1].a.includes(k)?3:0)+(L[i+1]&&L[i+1].a.includes(k)?3:0),sc=tot+adj+rnd();if(sc<bs){bs=sc;best=k}});
if(best<0){$("wm").textContent="Nessun sostituto disponibile.";return}
S.log.unshift(`${fmt(s.d)} ${year} · ${R[r]}: ${P[old]} assente → ${P[best]}`);s.a[r]=best;if(!s.e.includes(r))s.e.push(r);save();close_();render()}}
function close_(){$("md").style.display="none"}
$("tb").onclick=e=>{const t=e.target.closest("td.c");if(t)open_(+t.dataset.i,+t.dataset.r)};
$("md").onclick=e=>{if(e.target.id==="md")close_()};
$("pv").onclick=()=>{M--;render()};$("nx").onclick=()=>{M++;render()};
$("sel").onchange=()=>{sel=+$("sel").value;render()};
$("pdf").onclick=()=>window.print();
let rgs=false;$("rg").onclick=()=>{if(!rgs){rgs=true;$("rg").textContent="Conferma: cancella modifiche";setTimeout(()=>{rgs=false;$("rg").textContent="Rigenera"},4000);return}
rgs=false;$("rg").textContent="Rigenera";S={D:gen(),log:[]};save();render()};
function avData(){year=2026+Math.floor(M/12);const mm=String(M%12+1).padStart(2,"0"),days=S.D[year].filter(s=>s.d.slice(5,7)===mm);
return{days,rows:P.map((n,p)=>{const busy=[],free=[];days.forEach(s=>{const r=s.a.indexOf(p);if(r>=0)busy.push(fmt(s.d)+" ("+RL[r]+")");else free.push(fmt(s.d))});return{n,busy,free}})}}
function avText(){const d=avData();return "DISPONIBILITÀ – "+MN[M%12]+" "+year+"\nTurni Audio/Video del mese: "+d.days.map(s=>fmt(s.d)).join(", ")+"\nTutti gli altri giorni del mese le persone sono libere.\n\n"+d.rows.map(x=>x.n+"\n  Occupato (Audio/Video): "+(x.busy.join(", ")||"mai")+"\n  Libero nei giorni di turno: "+(x.free.join(", ")||"mai")).join("\n\n")}
$("dv").onclick=()=>{const d=avData();
$("mb").innerHTML=`<b>Disponibilità · ${MN[M%12]} ${year}</b><div class="sub">Occupato = in turno Audio/Video. Tutti gli altri giorni sono liberi.</div><div style="max-height:45vh;overflow:auto">`+d.rows.map(x=>`<div class="lg"><b>${x.n}</b><br>Occupato: ${x.busy.join(", ")||"mai"}</div>`).join("")+`</div><button class="pr" id="sh">Condividi file</button><button id="pp">Stampa / PDF</button><button id="cl">Chiudi</button>`;
$("md").style.display="flex";$("cl").onclick=close_;
$("sh").onclick=async()=>{const f=new File([avText()],"Disponibilita-"+MN[M%12]+"-"+year+".txt",{type:"text/plain"});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==="AbortError")return}
const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()};
$("pp").onclick=()=>{$("pa").innerHTML=`<h3>Disponibilità ${MN[M%12]} ${year}</h3><p>Turni Audio/Video: ${d.days.map(s=>fmt(s.d)).join(", ")}. Tutti gli altri giorni sono liberi.</p><table><tr><th>Persona</th><th>Occupato (Audio/Video)</th><th>Libero nei giorni di turno</th></tr>`+d.rows.map(x=>`<tr><td>${x.n}</td><td>${x.busy.join(", ")||"–"}</td><td>${x.free.join(", ")||"–"}</td></tr>`).join("")+"</table>";
document.body.classList.add("pa");window.print();document.body.classList.remove("pa")}};

function turniText(){year=2026+Math.floor(M/12);const mm=String(M%12+1).padStart(2,"0");
return "🎧 TURNI AUDIO/VIDEO – "+MN[M%12].toUpperCase()+" "+year+"\n\n"+S.D[year].filter(s=>s.d.slice(5,7)===mm).map(s=>"🗓 "+fmtL(s.d).toUpperCase()+"\n"+s.a.map((p,r)=>RL[r]+": "+P[p]).join("\n")).join("\n\n")}
$("tt").onclick=async()=>{const t=turniText();try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e.name==="AbortError")return}
try{await navigator.clipboard.writeText(t);$("tt").textContent="✓ Copiato"}catch(e){}};

$("rb").onclick=()=>$("rs").classList.add("o");$("rc").onclick=()=>$("rs").classList.remove("o");
$("rs").onclick=e=>{if(e.target.id==="rs")$("rs").classList.remove("o")};

render();
try{if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
</script></body></html>
